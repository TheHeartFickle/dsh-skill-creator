# @theheartfickle/dsh-skill-creator-plugin bundle patch
#
# When installed through the official CLI:
#
#   dsh plugin --profile <name> add @theheartfickle/dsh-skill-creator-plugin@latest
#
# or listed in `dsh.profile.bundles`, this patch inserts the plugin row so the
# bundled `dsh-skill-creator` skill provider is mounted.
- insert:
    - id: skill-creator
      name: '@theheartfickle/dsh-skill-creator-plugin'
